id = "bambulab"
name = "Bambu Lab"
version = "0.1.0"
description = "Follow your Bambu Lab 3D printer's prints by voice and in rules, pause or stop them, and hear when they finish."
authors = ["Mark Nygaard Leth"]
homepage = "https://github.com/MarkNygaard/niles-bambulab"
min_niles = "0.2.0"
interface = "0.2"
# No built-in group is about workshop machines, so it shows under Custom.
logo = "logo.svg"
keywords = [
    "printer", "printers", "3d printer", "3d", "print", "prints", "printing",
    "print job", "bambu", "bambu lab", "x1c", "x1 carbon", "nozzle", "hotend",
    "bed", "build plate", "chamber", "chamber light", "filament", "layer", "layers",
    "benchy", "printeren", "3d-printer", "udskrift", "udskriften",
]

[permissions]
devices = true
tools = true
ui = true
notify = true
mqtt = [
    { name = "printer", host = "setting:address", port = 8883, tls = "trust-device" },
]

[[settings]]
key = "address"
label = "Printer address"
type = "string"
required = true
help = "The printer's IP address, under Settings → Network (WLAN) on its screen, such as 192.168.1.40. Give it a fixed address in your router."

[[settings]]
key = "serial"
label = "Serial number"
type = "string"
required = true
help = "On the printer's screen under Settings → Device, or in Bambu Studio's Device tab. It starts with 00M on an X1C."

[[settings]]
key = "access_code"
label = "LAN access code"
type = "secret"
required = true
help = "The eight characters under Settings → Network (WLAN) on the printer's screen. Turn on LAN Only mode there, and on firmware from 2025 on, Developer mode too, or the printer will not take commands from Niles."

[[settings]]
key = "room"
label = "Room"
type = "room"
required = true
help = "Where the printer stands. Its devices join this room: the printer, its chamber light and its print job."

[[settings]]
key = "announce_room"
label = "Say when a print is done in"
type = "room"
help = "Niles says when a print finishes or fails in this room. Leave it empty for no announcements."

[[settings]]
key = "time_zone"
label = "Time zone"
type = "choice"
default = "europe_central"
help = "For the clock time a print will be done. Plugins are not told the house's time zone."
options = [
    { value = "utc", label = "UTC" },
    { value = "europe_west", label = "London, Dublin, Lisbon" },
    { value = "europe_central", label = "Copenhagen, Berlin, Paris, Oslo, Stockholm" },
    { value = "europe_east", label = "Helsinki, Athens, Kyiv" },
    { value = "us_eastern", label = "US Eastern" },
    { value = "us_central", label = "US Central" },
    { value = "us_mountain", label = "US Mountain" },
    { value = "us_arizona", label = "Arizona" },
    { value = "us_pacific", label = "US Pacific" },
    { value = "india", label = "India" },
    { value = "china", label = "China" },
    { value = "japan", label = "Japan" },
]

[[ui.menu]]
id = "printer"
label = "3D printer"
icon = "printer"
# The page shows "last report 12 s ago" and the time left.
refresh_every = 60

[[ui.widgets]]
id = "printer_now"
title = "3D printer"
# A widget's room is fixed in the manifest; the household moves it to
# the printer's room from the plugin's panel. Without one it starts on
# the front page.
refresh_every = 60
