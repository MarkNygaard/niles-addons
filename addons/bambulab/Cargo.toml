[package]
name = "bambulab"
version = "0.2.0" # x-release-please-version
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A Bambu Lab X1C 3D printer integration for Niles."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
serde_json = "1"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tzdb-bundle-always"] }

[lints]
workspace = true
